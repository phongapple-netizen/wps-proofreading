name: Publish v0.3.2 release

on:
  push:
    branches:
      - release/tag-v0.3.2

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d41b10df0f8d8a381c01d25a6af1cc1219297d80
          fetch-depth: 0
      - name: Verify release tag and version
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          test "$(git rev-parse 'refs/tags/v0.3.2^{commit}')" = "d41b10df0f8d8a381c01d25a6af1cc1219297d80"
          test "$(node -p "require('./package.json').version")" = "0.3.2"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "d41b10df0f8d8a381c01d25a6af1cc1219297d80" refs/remotes/origin/main

  windows:
    needs: validate
    uses: ./.github/workflows/release-windows.yml
    with:
      release_ref: d41b10df0f8d8a381c01d25a6af1cc1219297d80

  macos:
    needs: validate
    uses: ./.github/workflows/release-macos.yml
    with:
      release_ref: d41b10df0f8d8a381c01d25a6af1cc1219297d80

  publish:
    needs: [validate, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d41b10df0f8d8a381c01d25a6af1cc1219297d80
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/release
      - uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: dist/release
      - name: Publish v0.3.2 prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.3.2"
          test -f "dist/release/WPS-Proofreading-0.3.2-Windows-x64-Setup.exe"
          test -f "dist/release/WPS-Proofreading-0.3.2-macOS.dmg"
          node scripts/release-notes.js
          gh release create "v0.3.2"             "dist/release/WPS-Proofreading-0.3.2-Windows-x64-Setup.exe"             "dist/release/WPS-Proofreading-0.3.2-macOS.dmg"             --title "WPS 文本校改 v0.3.2 · 测试版"             --notes-file release-notes.md             --prerelease             --verify-tag

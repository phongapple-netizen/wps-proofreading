name: Publish v0.3.1 release

on:
  push:
    branches:
      - release/tag-v0.3.1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6c4602627e8ea1ef4a8f6ec54e241371ed12e946
          fetch-depth: 0
      - name: Verify release tag and version
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          test "$(git rev-parse 'refs/tags/v0.3.1^{commit}')" = "6c4602627e8ea1ef4a8f6ec54e241371ed12e946"
          test "$(node -p "require('./package.json').version")" = "0.3.1"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "6c4602627e8ea1ef4a8f6ec54e241371ed12e946" refs/remotes/origin/main

  windows:
    needs: validate
    uses: ./.github/workflows/release-windows.yml
    with:
      release_ref: 6c4602627e8ea1ef4a8f6ec54e241371ed12e946

  macos:
    needs: validate
    uses: ./.github/workflows/release-macos.yml
    with:
      release_ref: 6c4602627e8ea1ef4a8f6ec54e241371ed12e946

  publish:
    needs: [validate, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6c4602627e8ea1ef4a8f6ec54e241371ed12e946
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/release
      - uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: dist/release
      - name: Publish v0.3.1 prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.3.1"
          test -f "dist/release/WPS-Proofreading-0.3.1-Windows-x64-Setup.exe"
          test -f "dist/release/WPS-Proofreading-0.3.1-macOS.dmg"
          node scripts/release-notes.js
          gh release create "v0.3.1"             "dist/release/WPS-Proofreading-0.3.1-Windows-x64-Setup.exe"             "dist/release/WPS-Proofreading-0.3.1-macOS.dmg"             --title "WPS 文本校改 v0.3.1 · 测试版"             --notes-file release-notes.md             --prerelease             --verify-tag

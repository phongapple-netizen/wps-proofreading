name: Build macOS installer

on:
  pull_request:
  workflow_call:
    inputs:
      release_ref:
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build universal installer
        run: npm run build:mac:installer
      - name: Verify installer registration and rollback self-tests
        run: |
          version="$(node -p "require('./package.json').version")"
          mount="$(mktemp -d)"
          hdiutil attach "dist/mac/WPS-文本校改-${version}-macOS.dmg" -mountpoint "$mount" -nobrowse -quiet
          trap 'hdiutil detach "$mount" -quiet; rmdir "$mount"' EXIT
          "$mount/WPS 文本校改.app/Contents/MacOS/WPSProofreading" --self-test
      - name: Prepare macOS release asset
        run: |
          version="$(node -p "require('./package.json').version")"
          asset="dist/mac/WPS-文本校改-${version}-macOS.dmg"
          public_asset="dist/mac/WPS-Proofreading-${version}-macOS.dmg"
          cp "$asset" "$public_asset"
      - name: Upload macOS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/mac/WPS-Proofreading-*-macOS.dmg
          if-no-files-found: error

name: Release macOS installer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-macos.yml
      - mac/**
      - scripts/build-mac-installer.sh
      - package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-macos]')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build universal installer
        run: npm run build:mac:installer
      - name: Create beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          asset="dist/mac/WPS-文本校对-${version}-macOS.dmg"
          cat > release-notes.md <<'NOTES'
          macOS 测试安装包，支持 macOS 11 及以上的 Intel 和 Apple 芯片 Mac。

          安装：打开 DMG，把应用拖入“应用程序”，运行应用并点击“安装并启动”，然后重启 WPS。

          需要预先安装 WPS。OpenCode、Ollama 或兼容模型接口需要另行配置；本包不包含 AI 模型。当前应用采用临时签名，尚未经 Apple 公证，首次打开可能需要在 macOS“隐私与安全性”中允许。

          安装说明、GPL 许可证和第三方说明均在 DMG 中。源代码可从本 Release 的标签下载。
          NOTES
          shasum -a 256 "$asset" >> release-notes.md
          gh release create "v${version}" "$asset" --target "$GITHUB_SHA" \
            --title "WPS 文本校对 v${version} · macOS 测试版" \
            --notes-file release-notes.md --prerelease

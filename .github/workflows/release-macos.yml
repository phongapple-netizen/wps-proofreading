name: Release macOS installer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-macos.yml
      - mac/**
      - scripts/build-mac-installer.sh
      - scripts/release-notes.js
      - package.json
      - package-lock.json
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-macos.yml
      - mac/**
      - scripts/build-mac-installer.sh
      - scripts/release-notes.js
      - package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-macos]')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build universal installer
        run: npm run build:mac:installer
      - name: Verify installer registration and rollback self-tests
        run: |
          version="$(node -p "require('./package.json').version")"
          mount="$(mktemp -d)"
          hdiutil attach "dist/mac/WPS-文本校改-${version}-macOS.dmg" -mountpoint "$mount" -nobrowse -quiet
          trap 'hdiutil detach "$mount" -quiet; rmdir "$mount"' EXIT
          "$mount/WPS 文本校改.app/Contents/MacOS/WPSProofreading" --self-test
      - name: Create beta release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          asset="dist/mac/WPS-文本校改-${version}-macOS.dmg"
          public_asset="dist/mac/WPS-Proofreading-${version}-macOS.dmg"
          cp "$asset" "$public_asset"
          node scripts/release-notes.js
          if gh release view "v${version}" >/dev/null 2>&1; then
            gh release upload "v${version}" "$public_asset" --clobber
          else
            gh release create "v${version}" --target "$GITHUB_SHA" \
              --title "WPS 文本校改 v${version} · 测试版" \
              --notes-file release-notes.md --prerelease || gh release view "v${version}" >/dev/null
            gh release upload "v${version}" "$public_asset" --clobber
          fi
          gh release edit "v${version}" --notes-file release-notes.md \
            --title "WPS 文本校改 v${version} · 测试版" --prerelease

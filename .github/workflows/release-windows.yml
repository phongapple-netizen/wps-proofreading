name: Release Windows x64 installer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-windows.yml
      - windows/**
      - scripts/build-windows-server.js
      - scripts/release-notes.js
      - package.json
      - package-lock.json
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-windows.yml
      - windows/**
      - scripts/build-windows-server.js
      - scripts/release-notes.js
      - package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-windows]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install dependencies
        run: npm ci
      - name: Run project tests
        run: npm test
      - name: Run native discovery, service and registration tests
        run: node scripts/build-windows-server.js --test
      - name: Build x64 server
        run: npm run build:windows:server
      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          $env:WPS_RELEASE_VERSION = (node -p "require('./package.json').version")
          $env:WPS_DIST_DIR = (Resolve-Path 'dist/windows').Path
          $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $iscc = if ($command) { $command.Source } else { $null }
          foreach ($candidate in @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe', 'C:\Program Files\Inno Setup 6\ISCC.exe')) {
            if (-not $iscc -and (Test-Path $candidate)) { $iscc = $candidate }
          }
          if (-not $iscc) { throw 'Inno Setup compiler not found on Windows runner.' }
          & $iscc 'windows/installer.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test install, service, and uninstall
        shell: pwsh
        timeout-minutes: 8
        run: |
          $version = node -p "require('./package.json').version"
          $server = (Resolve-Path 'dist/windows/WPSProofreadingServer.exe').Path
          $selfTest = Start-Process -FilePath $server -ArgumentList '--self-test' -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) { throw 'Windows server self-test failed.' }

          $publish = Join-Path $env:APPDATA 'kingsoft\wps\jsaddons\publish.xml'
          New-Item -ItemType Directory -Force -Path (Split-Path $publish) | Out-Null
          Set-Content -Path $publish -Encoding UTF8 -Value '<?xml version="1.0"?><jsplugins><jspluginonline name="other-addon" url="https://example.test/"/></jsplugins>'

          $installer = (Resolve-Path "dist/windows/WPS-Proofreading-$version-Windows-x64-Setup.exe").Path
          $install = [System.Diagnostics.Process]::Start($installer, '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART')
          if (-not $install.WaitForExit(120000)) { $install.Kill(); throw 'Installer timed out.' }
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }

          $registered = Get-Content $publish -Raw
          if ($registered -notmatch 'name="wps-text-proofreading"' -or $registered -notmatch 'name="other-addon"') { throw 'WPS registration did not preserve the other add-on.' }
          $startup = (Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name WPSProofreading -ErrorAction Stop).WPSProofreading
          if ($startup -notmatch 'WPSProofreadingServer.exe') { throw 'Login startup entry missing.' }

          $ready = $false
          for ($attempt = 0; $attempt -lt 20; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri 'http://127.0.0.1:3891/package.json' -UseBasicParsing -TimeoutSec 2
              $package = $response.Content | ConvertFrom-Json
              if ($package.name -eq 'wps-text-proofreading' -and $package.version -eq $version) { $ready = $true; break }
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ready) { throw 'Installed local service did not start.' }
          $guide = (Invoke-WebRequest -Uri 'http://127.0.0.1:3891/ui/taskpane.html' -UseBasicParsing -TimeoutSec 5).Content
          if ($guide -notmatch 'opencode serve --hostname 127\.0\.0\.1 --port 4096 --cors http://127\.0\.0\.1:3891') { throw 'Updated OpenCode guide is missing from the installed add-on.' }

          $uninstaller = Join-Path $env:LOCALAPPDATA 'Programs\WPSProofreading\unins000.exe'
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed: $($uninstall.ExitCode)" }
          $remaining = Get-Content $publish -Raw
          if ($remaining -match 'name="wps-text-proofreading"' -or $remaining -notmatch 'name="other-addon"') { throw 'Uninstall did not preserve the other add-on.' }
          if (Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name WPSProofreading -ErrorAction SilentlyContinue) { throw 'Login startup entry remained after uninstall.' }

          # Exercise the installer preflight failure without administrator
          # permissions: an unrelated local listener must remain untouched and
          # the user's WPS XML and pre-existing Run value must remain unchanged.
          $originalXml = [System.IO.File]::ReadAllText($publish)
          $runPath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $priorRun = '"prior-user-service.exe" --serve'
          Set-ItemProperty -Path $runPath -Name WPSProofreading -Value $priorRun
          $blockerScript = Join-Path $env:TEMP 'wps-proofreading-port-blocker.js'
          Set-Content -Path $blockerScript -Encoding UTF8 -Value 'require("node:net").createServer().listen(3891,"127.0.0.1")'
          $blocker = Start-Process -FilePath 'node' -ArgumentList "`"$blockerScript`"" -PassThru -WindowStyle Hidden
          try {
            $occupied = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              $client = [System.Net.Sockets.TcpClient]::new()
              try { $client.Connect('127.0.0.1', 3891); $occupied = $true; break } catch { Start-Sleep -Milliseconds 250 } finally { $client.Dispose() }
            }
            if (-not $occupied) { throw 'Could not start the fake 3891 port blocker.' }
            $failedInstall = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
            if ($failedInstall.ExitCode -eq 0) { throw 'Installer unexpectedly succeeded while 3891 was occupied.' }
            if ([System.IO.File]::ReadAllText($publish) -ne $originalXml) { throw 'Failed install changed publish.xml.' }
            $restoredRun = (Get-ItemProperty -Path $runPath -Name WPSProofreading -ErrorAction Stop).WPSProofreading
            if ($restoredRun -ne $priorRun) { throw 'Failed install changed the pre-existing Run value.' }
          } finally {
            if ($blocker -and -not $blocker.HasExited) { Stop-Process -Id $blocker.Id -Force }
            Remove-Item $blockerScript -Force -ErrorAction SilentlyContinue
            Remove-ItemProperty -Path $runPath -Name WPSProofreading -ErrorAction SilentlyContinue
          }

      - name: Create Windows beta release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $asset = "dist/windows/WPS-Proofreading-$version-Windows-x64-Setup.exe"
          node scripts/release-notes.js
          gh release view "v$version" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create "v$version" --target $env:GITHUB_SHA --title "WPS 文本校对 v$version · 测试版" --notes-file release-notes.md --prerelease
            if ($LASTEXITCODE -ne 0) {
              gh release view "v$version" --json tagName 2>$null | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Could not create or locate v$version release." }
            }
          }
          gh release upload "v$version" $asset --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "v$version" --title "WPS 文本校对 v$version · 测试版" --notes-file release-notes.md --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
